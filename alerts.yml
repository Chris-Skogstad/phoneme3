3. No alert rules
The brief lists alerts next to metrics, and nothing in prometheus.yaml defines one. Add one that fires when Prometheus cannot reach the collector. Create alerts.yml next to docker-compose.yml:
groups:
  - name: phoneme-alerts
    rules:
      - alert: CollectorDown
        expr: up{job='otel-collector'} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus cannot scrape the OpenTelemetry collector'